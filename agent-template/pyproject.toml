[project]
name = "bionic-agent"
version = "0.3.0"
description = "LiveKit voice agent with two-brain architecture: fast primary LLM + Letta secondary executor"
requires-python = ">=3.11"
dependencies = [
    # Pinned exact, as a set. The agents core and its first-party plugins
    # are released in lockstep on one version number, so a floating
    # constraint lets an unrelated rebuild move the whole runtime: the
    # 2026-09-06 image silently went 1.7.1 -> 1.8.0 with no code change.
    # Bump these together and deliberately, never incidentally.
    "livekit-agents==1.8.0",
    "livekit-plugins-silero==1.8.0",
    "livekit-plugins-openai==1.8.0",
    "livekit-plugins-turn-detector==1.8.0",
    # Pinned exact (not >=): the 7-voice list and the bulbul:v2 model
    # pin in plugins.py are both verified against this specific
    # version's MODEL_SPEAKER_COMPATIBILITY table (2026-07-15) — a
    # later minor/patch bump could silently change that table with no
    # test catching it until a live synthesis call fails.
    "livekit-plugins-sarvam==1.6.5",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "langfuse>=3.0.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-httpx>=0.44b0",
    "Pillow>=10.0.0",
    "minio>=7.2.0",
]

[project.optional-dependencies]
fallback = [
    "livekit-plugins-deepgram==1.8.0",
    "livekit-plugins-cartesia==1.8.0",
]
# Default avatar provider — flashhead is a Bionic fork plugin that
# speaks to an in-cluster flashhead-engine over WebSocket.
avatar = [
    "livekit-plugins-flashhead @ git+https://github.com/Bionic-AI-Solutions/livekit-plugins.git#subdirectory=flashhead",
]
# Legacy BitHuman runtime — still wired behind avatar_provider=bithuman.
avatar-bithuman = [
    "livekit-plugins-bithuman==1.8.0",
]
all-providers = [
    "livekit-plugins-deepgram==1.8.0",
    "livekit-plugins-elevenlabs==1.8.0",
    "livekit-plugins-cartesia==1.8.0",
    "livekit-plugins-flashhead @ git+https://github.com/Bionic-AI-Solutions/livekit-plugins.git#subdirectory=flashhead",
    "livekit-plugins-bithuman==1.8.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
